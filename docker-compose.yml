version: '3.8'

services:

  # ─── Laravel App (PHP 8.3 FPM) ───────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: booking_app
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
      - ./storage:/var/www/storage
    environment:
      - APP_ENV=local
    networks:
      - booking_network
    depends_on:
      db:
        condition: service_healthy

  # ─── Nginx Web Server ─────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: booking_nginx
    restart: unless-stopped
    ports:
      - "8000:80"   # API diakses di http://localhost:8000
    volumes:
      - .:/var/www
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - booking_network

  # ─── MySQL 8.0 Database ───────────────────────────────────────────────────────
  db:
    image: mysql:8.0
    container_name: booking_db
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: booking_lapangan_db
      MYSQL_ROOT_PASSWORD: root
      MYSQL_USER: booking_user
      MYSQL_PASSWORD: booking_pass
    ports:
      - "3307:3306"   # Bisa diakses dari host via port 3306
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - booking_network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── phpMyAdmin (opsional, buat lihat database) ───────────────────────────────
  phpmyadmin:
    image: phpmyadmin:latest
    container_name: booking_phpmyadmin
    restart: unless-stopped
    ports:
      - "8080:80"   # Akses phpMyAdmin di http://localhost:8080
    environment:
      PMA_HOST: db
      PMA_USER: root
      PMA_PASSWORD: root
    depends_on:
      - db
    networks:
      - booking_network

networks:
  booking_network:
    driver: bridge

volumes:
  db_data:
    driver: local
